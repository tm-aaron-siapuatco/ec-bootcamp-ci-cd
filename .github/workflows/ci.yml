name: CI Pipeline
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Setup Job
              run: echo "Starting CI Pipeline"
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Install dependencies and test
              run : | 
                pip install -r requirements.txt
                pytest -q
            - name: Run tests
              run: pytest tests/
    deploy:
        runs-on: ubuntu-latest
        environment: production
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Deploy
              env: 
                   API_KEY: ${{ secrets.API_KEY }}
              run: chmod +x ./scripts/deploy.sh && ./scripts/deploy.sh